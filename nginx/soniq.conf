# ==============================================================================
# Nginx Configuration for Soniq (soniq.dibbu.dev)
# Production Reverse Proxy & Static Asset Serving
# ==============================================================================

# HTTP - Redirect all traffic to HTTPS (or serve certbot verification)
server {
    listen 80;
    listen [::]:80;

    server_name soniq.dibbu.dev;

    # Certbot challenge location for SSL certificate renewal/issuance
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Main Production Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name soniq.dibbu.dev;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/soniq.dibbu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soniq.dibbu.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend Static Webroot
    root /var/www/soniq;
    index index.html;

    # Client body limit
    client_max_body_size 20M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==============================================================================
    # Backend Express API & Share Proxy (Port 3001)
    # ==============================================================================
    location ~ ^/(api|share) {
        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Socket.IO / WebSockets (if used by game or backend)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ==============================================================================
    # Static Assets & Caching
    # ==============================================================================
    # Built Vite hashed assets (cache immutable for 1 year)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Common static web resources
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ==============================================================================
    # SPA Client Routing Fallback
    # ==============================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }
}
