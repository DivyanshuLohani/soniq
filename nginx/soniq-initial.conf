# ==============================================================================
# Initial HTTP-Only Configuration (Use this BEFORE running certbot)
# ==============================================================================
# Once your DNS points to this server and you run:
#   certbot --nginx -d soniq.dibbu.dev
# Certbot will automatically upgrade this to HTTPS, or you can switch to soniq.conf.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;

    server_name soniq.dibbu.dev;

    # Frontend Static Webroot
    root /var/www/soniq;
    index index.html;

    client_max_body_size 20M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend API & Share Proxy (Port 3001)
    location ~ ^/(api|share) {
        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Built Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Common static web resources
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA Client Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
